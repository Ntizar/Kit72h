<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kit72h — Maqueta C · Manual de campaña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--cobre:#b06f30;--peligro:#c0392b;--tinta:#241a0f;--papel:#ece3d1;--papel-2:#e3d7c0;--noche:#141008;--borde:#c9b896}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--noche);color:var(--tinta);font:16px/1.6 Georgia,"Times New Roman",serif;overflow-x:hidden;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:0 22px}
header{background:var(--noche);border-bottom:1px solid rgba(176,111,48,.4);padding:18px 0;position:sticky;top:0;z-index:5}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-family:"Rubik Dirt";font-size:22px;color:#e0a464;text-decoration:none;letter-spacing:2px}
.logo b{color:var(--peligro)}
nav a{color:#a8927c;text-decoration:none;font:600 12px/1 "Barlow Condensed";letter-spacing:2px;text-transform:uppercase;margin-left:16px}
nav a:hover{color:#e0a464}
.hero{background:var(--papel);margin-top:28px;padding:40px 34px 30px;border-radius:4px;box-shadow:0 14px 40px rgba(0,0,0,.55);position:relative}
.hero::before{content:"";position:absolute;inset:10px;border:1px dashed rgba(36,26,15,.25);pointer-events:none;border-radius:2px}
.matricula{display:flex;justify-content:space-between;font:600 11px/1 "Barlow Condensed";letter-spacing:2.5px;text-transform:uppercase;color:#8a6f4d;border-bottom:1px solid rgba(36,26,15,.25);padding-bottom:10px;margin-bottom:22px;flex-wrap:wrap;gap:6px}
.hero h1{font-family:"Rubik Dirt";font-weight:400;font-size:clamp(30px,5vw,52px);line-height:1.05;color:var(--tinta)}
.hero h1 .q{color:var(--peligro)}
.hero p{max-width:560px;margin-top:12px;font-size:16.5px}
.lema{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px;font:700 13px/1.5 "Barlow Condensed";letter-spacing:1.5px;text-transform:uppercase;color:#6b4e2a}
.cuerpo{margin:26px 0 10px;background:var(--papel);border-radius:4px;box-shadow:0 14px 40px rgba(0,0,0,.55);padding:34px}
h2.cap{font:700 12px/1 "Barlow Condensed";letter-spacing:3px;text-transform:uppercase;color:#8a6f4d;margin-bottom:18px}
.indice{list-style:none}
.indice li{display:grid;grid-template-columns:56px 40px 1fr auto;gap:14px;align-items:center;padding:14px 6px;border-bottom:1px dotted rgba(36,26,15,.35);cursor:pointer;transition:background .12s}
.indice li:hover{background:rgba(176,111,48,.12)}
.indice .num{font:700 26px/1 "Barlow Condensed";color:rgba(176,111,48,.65)}
.indice .ico{font-size:22px;text-align:center}
.indice .ti{font-weight:700;font-size:16.5px}
.indice .ti small{display:block;font-weight:400;font-size:13.5px;color:#5f4c33;margin-top:2px}
.indice .me{font:600 12.5px/1.5 "Barlow Condensed";letter-spacing:.5px;color:#6b4e2a;white-space:nowrap;text-align:right}
@media(max-width:640px){.indice li{grid-template-columns:44px 34px 1fr}.indice .me{display:none}}
.hoja{background:var(--papel);border-radius:4px;box-shadow:0 14px 40px rgba(0,0,0,.55);padding:38px;margin:26px 0}
.hoja h1{font-family:"Rubik Dirt";font-weight:400;font-size:clamp(24px,4vw,38px);line-height:1.1}
.hoja .res{margin-top:10px;color:#4a3820;max-width:620px}
.sello{display:inline-block;margin-top:14px;font:700 11px/1 "Barlow Condensed";letter-spacing:2px;text-transform:uppercase;border:1.5px solid var(--cobre);color:var(--cobre);padding:7px 12px;border-radius:3px}
h3.sec{font:700 13px/1 "Barlow Condensed";letter-spacing:2.5px;text-transform:uppercase;color:var(--cobre);margin:30px 0 4px}
ul.ck{list-style:none;margin-top:8px}
ul.ck li{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px dotted rgba(36,26,15,.4);font-size:15.5px}
ul.ck input{width:19px;height:19px;accent-color:var(--cobre);margin-top:3px;flex-shrink:0;cursor:pointer}
ul.ck .t{flex:1}
ul.ck small{display:block;font-size:13px;color:#5f4c33;margin-top:1px}
ul.ck .p{font:600 13px/1.6 "Barlow Condensed";color:#6b4e2a;white-space:nowrap}
.prio{font:700 9px/1 "Barlow Condensed";letter-spacing:1.5px;text-transform:uppercase;color:var(--peligro);border:1px solid var(--peligro);padding:2px 6px;border-radius:2px;margin-left:6px;font-style:normal}
.nota{font-size:13.5px;color:#6b4e2a;background:var(--papel-2);border-left:3px solid var(--cobre);padding:10px 14px;margin:16px 0;border-radius:0 3px 3px 0}
.volver{display:inline-block;margin:22px 0 0;color:var(--cobre);text-decoration:none;font:700 12px/1 "Barlow Condensed";letter-spacing:2px;text-transform:uppercase}
footer{background:var(--noche);padding:28px 0 90px;font-size:12.5px;color:#8a7a63}
footer .att{margin-top:6px;color:#6b4e2a;letter-spacing:1px}
.tag{position:fixed;right:12px;bottom:12px;z-index:9;background:rgba(13,10,7,.92);border:1px solid var(--peligro);color:var(--peligro);font:700 11px/1 "Barlow Condensed";letter-spacing:2px;padding:8px 12px;border-radius:6px;text-transform:uppercase}
@media print{
 body{background:#fff}
 .hero,.hoja{box-shadow:none;border:1px solid #999}
 .hero::before,header,footer,.tag,nav{display:none!important}
 body,html{background:#fff}
 .hoja{margin:0;padding:20px}
}
</style>
</head>
<body>
<header><div class="wrap bar">
<a class="logo" href="#" onclick="go('home');return false">KIT<b>72H</b></a>
<nav><a href="#" onclick="go('home');return false">Kits</a><a href="#" onclick="go('blog');return false">Blog</a><a href="#" onclick="go('home');return false">Fuentes</a></nav>
</div></header>
<div class="wrap"><main id="app"></main></div>
<footer><div class="wrap"><p>Como afiliado de Amazon, Kit72h obtiene ingresos por las compras que cumplan los requisitos aplicables. Precios orientativos.</p><p class="att">Hecho con ❤️ — Kit72h</p></div></footer>
<div class="tag">Maqueta C · datos de ejemplo</div>
<script>
const KITS=[
{s:'basico-72h',t:'Kit básico 72h',i:'🎒',c:'100–180 €',n:16,r:'Agua, comida, luz, radio, botiquín y documentos. El kit del que nacen todos los demás.'},
{s:'dana',t:'Kit DANA / inundación',i:'🌊',c:'90–160 €',n:14,r:'Subidas de agua relámpago: evacuar a pie sin perder nada esencial.'},
{s:'apagon',t:'Kit apagón',i:'🔌',c:'90–200 €',n:15,r:'12 horas sin luz lo demostraron: luz, radio, batería y frío seguro.'},
{s:'coche',t:'Kit coche',i:'🚗',c:'60–120 €',n:12,r:'V-16 conectada, chaleco, cables y lo que salva una noche esperando grúa.'},
{s:'hogar',t:'Kit hogar / confinamiento',i:'🏠',c:'150–300 €',n:18,r:'Gases, reserva de agua y comida, detector de CO: quedar dentro y estar bien.'},
{s:'montana',t:'Kit montaña',i:'⛰️',c:'80–150 €',n:14,r:'Frío, brújula y manta térmica: el día se alarga cuando falla el móvil.'},
{s:'calor',t:'Kit ola de calor',i:'🥵',c:'50–110 €',n:11,r:'Ventiladores, suero, toldos y la rutina que evita el golpe de calor.'},
{s:'evacuacion',t:'Mochila de evacuación',i:'🧳',c:'70–140 €',n:13,r:'La mochila que sales con ella en 3 minutos: documentos, efectivo y esenciales.'},
{s:'huerto',t:'Huerto y autosuficiencia',i:'🌱',c:'40–90 €',n:10,r:'Semillas, germinados y herramientas: seguridad alimentaria a medio plazo.'},
{s:'30-dias',t:'Kit 30 días',i:'📆',c:'250–500 €',n:20,r:'Del 72h al mes: agua, conservas, higiene y mantenimiento del kit.'},
{s:'bebe',t:'Kit bebé y lactancia',i:'🍼',c:'80–160 €',n:12,r:'Leche, pañales y lo que nadie recuerda hasta que hace falta.'},
{s:'mayores',t:'Kit persona mayor',i:'🧓',c:'60–130 €',n:12,r:'Medicación de reserva, dosis y contacto médico. Autonomía con dignidad.'}
];
const SECCIONES=[
{t:'Luz y energía',items:[
 ['Linterna LED por persona','Pilas de reserva; mejor que velas por riesgo de incendio.','8–20 €','esencial'],
 ['Lámpara de camping recargable','Ilumina la habitación entera; recárgala cada mes.','10–25 €','esencial'],
 ['Batería externa 20.000 mAh','3-4 cargas de móvil; recárgala el primer día del aviso.','25–45 €','esencial'],
 ['SAI (UPS) para el router','Mantiene internet 3-6 h: llamadas y noticias.','60–120 €','recomendado'],
 ['Panel solar plegable 40 W','Recarga en ventana o balcón si el corte se alarga.','60–100 €','recomendado']]},
{t:'Información',items:[
 ['Radio de dinamo o pilas AM/FM','La única fuente si caen la luz y los datos móviles.','15–35 €','esencial'],
 ['Silbato','Señal de auxilio sin gastar voz ni batería.','2–5 €','esencial']]},
{t:'Cocina y agua',items:[
 ['Cocina de camping de gas','Café caliente y sopas sin humos dentro de casa.','25–60 €','recomendado'],
 ['Bidones de agua 10–20 L','3 L por persona y día solo para beber.','8–18 €','esencial'],
 ['Comida de 3 días sin cocina','Conservas, frutos secos, chocolate.','20–40 €','esencial']]}
];
function home(){return `
<section class="hero">
<div class="matricula"><span>Cuaderno de campo · Ed. 2026</span><span>Fuentes: UE JOIN(2025) 90 · Protección Civil</span></div>
<h1>Manual de preparación para <span class="q">72 horas</span> sin nada</h1>
<p>Doce kits, listas de producto verificadas y la guía antes-durante-después de cada escenario. Nada de supervivencia extremista: lo que las fuentes oficiales piden tener en casa.</p>
<div class="lema"><span>12 kits</span><span>180+ productos</span><span>30 guías</span><span>Imprimible</span></div>
</section>
<section class="cuerpo">
<h2 class="cap">Índice de kits</h2>
<ul class="indice">
${KITS.map((k,x)=>`<li onclick="go('kit','${k.s}')"><span class="num">${String(x+1).padStart(2,'0')}</span><span class="ico">${k.i}</span><span class="ti">${k.t}<small>${k.r}</small></span><span class="me">${k.n} prod.<br>${k.c}</span></li>`).join('')}
</ul>
</section>`;}
function detalle(slug){
  const k=KITS.find(x=>x.s===slug)||KITS[0];
  const secs=k.s==='apagon'?SECCIONES:null;
  return `<a class="volver" href="#" onclick="go('home');return false">← Volver al índice</a>
<section class="hoja">
<h1>${k.i} ${k.t}</h1>
<p class="res">${k.r}</p>
<span class="sello">Capítulo oficial · Fuente: UE + Protección Civil</span>
${secs?secs.map(s=>`<h3 class="sec">${s.t}</h3><ul class="ck">${s.items.map(i=>`<li><input type="checkbox"><span class="t">${i[0]}<em class="prio">${i[3]}</em><small>${i[1]}</small></span><span class="p">~ ${i[2]}</span></li>`).join('')}</ul>`).join(''):`<p class="nota">Maqueta: solo el kit apagón lleva hoja de ejemplo. Aquí iría la lista completa de ${k.n} productos de «${k.t}», lista para imprimir y marcar con bolígrafo.</p>`}
</section>`;}
function blog(){return `<section class="cuerpo" style="margin-top:28px"><h2 class="cap">Cuaderno · últimas entradas</h2>
<ul class="indice">${[['Kit de emergencia en el trabajo: qué guardar en el cajón','27-09-2026 · 6 min'],['Salud mental y sueño en una emergencia: cómo sostener la cabeza','24-09-2026 · 8 min'],['Conservar comida sin nevera: qué aguanta de verdad y qué tirar','21-09-2026 · 7 min']].map((e,x)=>`<li onclick="return false"><span class="num">·${x+1}</span><span class="ico">📝</span><span class="ti">${e[0]}<small>${e[1]}</small></span><span class="me">leer</span></li>`).join('')}</ul></section>`;}
function go(v,s){
  const app=document.getElementById('app');
  if(v==='kit')app.innerHTML=detalle(s);
  else if(v==='blog')app.innerHTML=blog();
  else app.innerHTML=home();
  window.scrollTo(0,0);
}
go('home');
</script>
</body>
</html>
