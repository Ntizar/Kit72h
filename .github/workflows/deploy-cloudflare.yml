name: Desplegar a Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    name: Subir el sitio a Cloudflare Pages
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Regenerar SEO (sitemap, feed, llms)
        run: python3 scripts/generar-seo.py

      - name: Pre-renderizar rutas a HTML estático
        run: python3 scripts/prerender.py

      - name: Diagnóstico de credenciales (temporal)
        run: |
          echo "token recibido: ${#CLOUDFLARE_API_TOKEN} caracteres"
          echo "account id recibido: [$CLOUDFLARE_ACCOUNT_ID]"
          printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-16 | sed 's/^/token sha256[:16] = /'
          code=$(curl -s -o /tmp/r.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/kit72h")
          echo "GET pages/projects/kit72h -> HTTP $code"
          head -c 200 /tmp/r.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Desplegar con wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=kit72h --branch=main --commit-dirty=true
