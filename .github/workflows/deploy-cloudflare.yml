name: Desplegar a Cloudflare Pages

# DESACTIVADO: kit72h.com se sirve desde GitHub Pages (pages.yml). Este workflow
# fallaba en cada push por un token de Wrangler sin permisos (exit 1 en
# «Getting User settings…») y el dominio no apunta aquí. Queda en manual con el
# job apagado para no dejar el CI en rojo: si algún día se quiere el doble
# despliegue, arreglar los secretos CLOUDFLARE_* y quitar el `if: false`.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desplegar:
    if: false
    runs-on: ubuntu-latest
    name: Subir el sitio a Cloudflare Pages
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Regenerar SEO (sitemap, feed, llms)
        run: python3 scripts/generar-seo.py

      - name: Pre-renderizar rutas a HTML estático
        run: python3 scripts/prerender.py

      - name: Desplegar con wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=kit72h --branch=main --commit-dirty=true
