name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages lista los artefactos del run por API antes de desplegar; sin
  # `actions: read` esa consulta vuelve vacía y el deploy muere con «Found 0
  # artifact(s)» aunque el artefacto sí está subido (comprobado por API).
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # GATE DE CALIDAD — corre ANTES del deploy y lo bloquea si hay errores.
  # Caza: fichas vacías o con la home copiada dentro, kits sin enlaces de compra,
  # enlaces internos muertos, HTML mal formado (p. ej. un <link> de CSS sin
  # cerrar que deja la web entera sin estilos), JSON-LD roto, versiones de
  # CSS/JS inconsistentes, blog sin cuerpo y fugas de términos vetados.
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Gate de calidad (bloquea el deploy si falla)
        run: python3 scripts/verificar-sitio.py
      # Un Tracking ID de otro marketplace, un typo o un enlace sin tag tiran la
      # comisión sin dar ningún error visible. El registro vive en
      # data/tags-afiliado.json y este gate lo compara con TODO enlace publicado.
      - name: Guardián de Tracking IDs de Amazon (bloquea el deploy si falla)
        run: python3 scripts/auditar-tags.py

  deploy:
    needs: verificar
    environment:
      name: github-pages
      url: ${{ steps.d3.outputs.page_url || steps.d2.outputs.page_url || steps.d1.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6

      # El sitio publicable se recorta con allowlist: nunca `path: '.'`.
      # Fuera del artefacto quedan README/SPEC/CRONS, notes/, sketches/,
      # busquedas/, los xlsx y cualquier fichero suelto del repo.
      - name: Preparar el sitio con allowlist
        run: |
          mkdir -p /tmp/_site/data
          cp index.html CNAME _headers robots.txt sitemap.xml feed.xml llms.txt llms-full.txt ccf78247a738a3e8795574e50bc2d87e.txt /tmp/_site/
          cp -r css js kit blog fuentes zona privacidad analiticas noticias assets /tmp/_site/
          cp data/*.json /tmp/_site/data/
          # Multi-mercado: overlays de idioma (los carga el JS) + las carpetas de país.
          cp -r data/i18n /tmp/_site/data/
          for carpeta in de fr it nl en-gb en-us; do
            [ -d "$carpeta" ] && cp -r "$carpeta" /tmp/_site/
          done
          exit 0

      # Guardia de privacidad: si un término vetado entra al sitio, aborta.
      - name: Guardia de privacidad
        run: |
          ! grep -r -I -l -E "david[ ._-]?antizar|d_a[n]t|mastermind\.local|C:[/\\]Users[/\\]d_a[n]t" /tmp/_site \
            || { echo "FUGA: contenido vetado dentro del sitio"; exit 1; }

      # El 23-25/11 el deploy de Pages fallaba de forma INTERMITENTE con «Deployment
      # failed, try again later» (estado: waiting → queued → in_progress → failure, sin
      # descripción): el artefacto se sube bien y es la API de Pages la que rechaza el
      # deployment. Un reintento inmediato pasa casi siempre, así que se intenta 3 veces;
      # si los tres fallan, el run queda rojo de verdad.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/_site
      - name: Desplegar en Pages (intento 1)
        id: d1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Desplegar en Pages (intento 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Desplegar en Pages (intento 3)
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v5

  # Recibo del sitio VIVO: el push ES el deploy, así que la prueba final es la
  # web publicada. Si algún tag sale mal en producción, el workflow se pone rojo.
  auditar-vivo:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Guardián de Tracking IDs sobre kit72h.com
        run: |
          sleep 60
          python3 scripts/auditar-tags.py --vivo
