name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # GATE DE CALIDAD — corre ANTES del deploy y lo bloquea si hay errores.
  # Caza: fichas vacías o con la home copiada dentro, kits sin enlaces de compra,
  # enlaces internos muertos, HTML mal formado (p. ej. un <link> de CSS sin
  # cerrar que deja la web entera sin estilos), JSON-LD roto, versiones de
  # CSS/JS inconsistentes, blog sin cuerpo y fugas de términos vetados.
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Gate de calidad (bloquea el deploy si falla)
        run: python3 scripts/verificar-sitio.py

  deploy:
    needs: verificar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # El sitio publicable se recorta con allowlist: nunca `path: '.'`.
      # Fuera del artefacto quedan README/SPEC/CRONS, notes/, sketches/,
      # busquedas/, los xlsx y cualquier fichero suelto del repo.
      - name: Preparar el sitio con allowlist
        run: |
          mkdir -p /tmp/_site/data
          cp index.html CNAME _headers robots.txt sitemap.xml feed.xml llms.txt llms-full.txt ccf78247a738a3e8795574e50bc2d87e.txt /tmp/_site/
          cp -r css js kit blog fuentes zona privacidad /tmp/_site/
          cp data/*.json /tmp/_site/data/

      # Guardia de privacidad: si un término vetado entra al sitio, aborta.
      - name: Guardia de privacidad
        run: |
          ! grep -r -I -l -E "david[ ._-]?antizar|d_a[n]t|mastermind\.local|C:[/\\]Users[/\\]d_a[n]t" /tmp/_site \
            || { echo "FUGA: contenido vetado dentro del sitio"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/_site
      - uses: actions/deploy-pages@v4
        id: deployment
