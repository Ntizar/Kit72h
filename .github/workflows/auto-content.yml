name: Auto-generación de contenido Kit72h
on:
  schedule:
    # Lunes y jueves a las 06:00 UTC (07:00 CET en invierno; 08:00 CEST en verano).
    # Es un generador auxiliar: el pipeline diario de contenidos vive en el cron
    # kit72h-crecimiento del VM y el publicador valida antes de publicar.
    - cron: '0 6 * * 1,4'
    # Miércoles a las 12:00 UTC (pines Pinterest)
    - cron: '0 12 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install playwright && playwright install chromium

      - name: Generate articles
        run: python scripts/generar-articulos.py

      - name: Generate Pinterest pins
        run: python scripts/generar-pins.py

      - name: Update sitemap
        run: python scripts/actualizar-sitemap.py

      - name: Commit and push
        run: |
          git config user.name "kit72h-auto"
          git config user.email "auto@kit72h.com"
          git add -- blog kit data pintout index.html sitemap.xml feed.xml llms.txt llms-full.txt
          git commit -m "auto(website): actualización automática de contenido y sitemap" || echo "No changes to commit"
          git push